# Publishes the container image for a release tag.
#
# Push a tag and this builds and pushes ghcr.io/jburanen/convoy:<version> plus
# :latest, which is what docker-compose.yml pulls:
#
#   git tag v1.0.0-rc.1 && git push origin v1.0.0-rc.1
#
# The GitHub Release itself is created separately, by hand (gh release create),
# deliberately AFTER the published image has been confirmed to deploy — a
# release that points at an image nobody has run is a claim, not a result.
#
# The test job gates the push: a tag whose code fails the suite must not become
# an image anyone can pull. It runs the same three checks as local development
# (pytest, ruff, mypy) so there is nothing to keep in sync.
name: release

on:
  push:
    tags:
      - "v*"
  # Lets a failed publish be retried without moving or re-cutting the tag.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (e.g. v1.0.0-rc.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,web]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy src

      - name: Test
        run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions; no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Spelled out rather than ${{ github.repository }}: GHCR rejects an
          # uppercase path, and this repository is 'Convoy'.
          images: ghcr.io/jburanen/convoy
          # {{version}} strips the leading v: v1.0.0-rc.1 -> 1.0.0-rc.1.
          # :latest tracks every release including this first candidate — there
          # is nothing else for it to point at, and the shipped compose file
          # defaults to it (operator-decided 2026-08-27).
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          # linux/amd64 only for now: every host this runs on is x86-64, and
          # adding linux/arm64 means QEMU emulation and a much longer build.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
