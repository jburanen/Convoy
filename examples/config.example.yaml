# Example config — SAFE TO COMMIT (non-sensitive defaults only).
# Copy to `config.yaml` (git-ignored) and adjust. Secrets never live here.

defaults:
  dry_run: true                 # mutating ops preview by default
  max_concurrent_firewalls: 2   # blast-radius cap (CLI planner only, see below)

paths:
  # Relative paths here resolve against THIS FILE's own directory, not
  # wherever the process happens to be started from — so in the Docker
  # deployment (this file copied to /data/config.yaml) these already mean
  # /data/state, /data/packages, etc. with no changes needed. Use absolute
  # paths instead only if you want a location outside the config file's
  # directory (e.g. a separate /data volume from state).
  reports_dir: reports
  logs_dir: logs
  state_dir: state
  db_path: state/orch.db        # jobs, credential ciphertext, package metadata
  packages_dir: packages        # uploaded package files
  inventory_path: inventory.yaml

# Independent management environments: each has its own inventory of management
# servers (firewalls are discovered per-environment via CDT) and its own
# credential namespace. Packages and the database are shared. Omit this block
# entirely for a single environment backed by paths.inventory_path.
# environments:
#   - name: corp
#     inventory: /data/inventories/corp.yaml
#   - name: dmz
#     inventory: /data/inventories/dmz.yaml

# NOTE on safety settings: this file deliberately does NOT offer
# `snapshot_before_install`, `stop_on_first_failure`, `reboot_after_install`, or
# `maintenance_window`. Earlier versions shipped them here and no code read any
# of them, which invited the assumption that a rollback snapshot was being taken
# or a maintenance window enforced. They will come back alongside the code that
# actually honours them. Today, rollout ordering and blast radius for CDT are
# whatever the operator puts in the candidates list — see the README's Safety
# model section.
