# chkp-cpuse-orch — test/dev deployment.
# Brought up on the test host by scripts/deploy.sh (git pull + up --build).
services:
  web:
    build: .
    image: chkp-cpuse-orch:dev
    container_name: chkp-cpuse-orch
    # Run as whichever host account ran the deploy (scripts/deploy.sh exports
    # DEPLOY_UID/DEPLOY_GID via `id -u`/`id -g`), so bind-mounted ./data is
    # always writable by the container without a manual chown — hardcoding a
    # specific account's uid/gid here broke on the first host whose deploying
    # user wasn't that exact uid (observed 2026-07-25: `mkdir -p data` on a
    # fresh host created a directory owned by whoever ran it, not 1001, and
    # the container — always uid 1001 — got Permission denied). Defaults to
    # 1001:1001 (devuser on the original dev host) if run without deploy.sh's
    # exports, e.g. a bare `docker compose up`.
    user: "${DEPLOY_UID:-1001}:${DEPLOY_GID:-1001}"
    ports:
      - "8080:8080"
    env_file:
      # Runtime secrets/config, git-ignored, next to this compose file. Holds the
      # credential-store master key (CHKP_CPUSE_MASTER_KEY) and — when the web UI's
      # LDAP authentication is enabled — the CHKP_CPUSE_LDAP_* settings (see
      # .env.example). NEVER commit .env. required:false so the stack still builds
      # on a host that hasn't created one yet (auth stays off, storage disabled).
      - path: .env
        required: false
    environment:
      # Config/inventory are read from the mounted data dir at runtime.
      CHKP_CPUSE_CONFIG: /data/config.yaml
      # Fallback for supplying the master key via the shell env instead of .env;
      # a value in .env (loaded above) is used when this is empty.
      CHKP_CPUSE_MASTER_KEY: ${CHKP_CPUSE_MASTER_KEY:-}
    volumes:
      - ./data:/data:rw
    restart: unless-stopped
    # No healthcheck override here — the Dockerfile's own HEALTHCHECK already
    # covers this (and follows CHKP_CPUSE_SSL_CERTFILE to probe https:// when
    # native TLS is on). A duplicate here previously went stale and always
    # probed plain http://, so a TLS-enabled deploy showed "unhealthy" even
    # though the app was serving fine over https.
