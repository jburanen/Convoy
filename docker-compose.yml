# Set CONVOY_TAG (in .env or the shell) to pin a published release instead of
# :latest. To run from source, see docker-compose.dev.yml and scripts/deploy.sh.
services:
  web:
    image: ghcr.io/jburanen/convoy:${CONVOY_TAG:-latest}
    container_name: convoy
    ports:
      - "8080:8080"
    env_file:
      # Master key, LDAP settings and the rest — see .env.example. Optional so 
      # the stack still comes up on a host without one defined.
      - path: .env
        required: false
    environment:
      CONVOY_CONFIG: /data/config.yaml
      # Used when .env doesn't set it. Master key MUST be set to enable cred store.
      CONVOY_MASTER_KEY: ${CONVOY_MASTER_KEY:-}
    volumes:
      # This works on any host with no preparation. The named volume can be 
      # replaced by a bind-mounted directory instead, but this is owned by 
      # whoever ran compose, and the container cannot write it — to use one 
      # anyway, replace this with
      # - ./data:/data:rw
      # and add 
      # `user: "${DEPLOY_UID:-1001}:${DEPLOY_GID:-1001}"` 
      # to this service. 
      - convoy-data:/data
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512

volumes:
  convoy-data:
